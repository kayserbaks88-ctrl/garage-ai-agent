{% if session.get('platform_admin_auth_source') == 'dedicated' and session.get('auth_role') == 'platform_admin' %}
<style>
.cc-back{display:flex;flex-wrap:wrap;gap:8px;padding:10px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));background:#0f172a;font:16px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.cc-back a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:10px;background:#1e293b;color:#fff;text-decoration:none;font-weight:600;-webkit-tap-highlight-color:transparent}
.cc-back a:focus-visible{outline:3px solid #38bdf8;outline-offset:2px}
</style>
<nav class="cc-back" aria-label="Platform administration navigation">
<a href="{{ url_for('staff.platform_control_centre') }}">&larr; Back to Control Centre</a>
{% for link in extra_links|default([]) %}<a href="{{ link.href }}">{{ link.label }}</a>{% endfor %}
</nav>
{% endif %}
